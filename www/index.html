<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E0D10">
<title>OneApp</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0E0D10;
  --surface: #17151C;
  --surface-2: #1E1B24;
  --border: rgba(255,255,255,0.06);
  --text: #F2F0F4;
  --text-dim: #9A96A3;
  --text-mute: #5E5A66;
  --accent: #B87A5E;
  --success: #6BA77E;
  --r-md: 14px; --r-lg: 20px; --r-pill: 999px;
}
html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: -50%; z-index: 0;
  background:
    radial-gradient(circle at 30% 30%, rgba(184,122,94,0.08) 0%, transparent 50%),
    radial-gradient(circle at 70% 70%, rgba(140,106,122,0.06) 0%, transparent 50%);
  animation: flowBg 22s ease-in-out infinite alternate;
}
@keyframes flowBg {
  0% { transform: translate(0,0) scale(1); }
  100% { transform: translate(-2%,3%) scale(1.05); }
}
.app {
  position: relative; z-index: 1;
  max-width: 500px; height: 100vh; margin: 0 auto;
  display: flex; flex-direction: column;
}
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 10px;
}
.title {
  font-size: 20px; font-weight: 700; letter-spacing: -0.3px;
  background: linear-gradient(90deg, #B87A5E, #8C6A7A, #6B7A8C, #A8705A);
  background-size: 300% 100%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: textFlow 12s ease-in-out infinite;
}
@keyframes textFlow {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.pill {
  padding: 6px 12px; border-radius: 20px;
  background: rgba(255,255,255,0.05);
  font-size: 11px; color: var(--text-dim); font-weight: 500;
  display: flex; align-items: center; gap: 6px;
}
.pill .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 6px var(--success);
}
.content { flex: 1; overflow-y: auto; padding: 6px 18px 24px; }
.content::-webkit-scrollbar { width: 0; }
.eyebrow {
  font-size: 11px; font-weight: 600; color: var(--text-mute);
  letter-spacing: 1.2px; margin: 18px 4px 12px;
}
.grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.tile {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 22px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  cursor: pointer; transition: transform 0.25s, background 0.2s;
  box-shadow: 4px 4px 12px rgba(0,0,0,0.5), -2px -2px 6px rgba(255,255,255,0.02);
}
.tile:active {
  transform: scale(0.96);
  background: var(--surface-2);
}
.icon-box {
  width: 64px; height: 64px; border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  animation: iconFloat 4s ease-in-out infinite;
}
@keyframes iconFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
.icon-text {
  font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
}
.name { font-size: 14.5px; font-weight: 600; }
.status {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--success);
}
.status .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--success);
}
.tabbar {
  display: flex; align-items: center; justify-content: space-around;
  padding: 8px 12px 14px;
  background: rgba(23,21,28,0.72);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid var(--border);
}
.tab {
  flex: 1; text-align: center;
  font-size: 11px; color: var(--text-mute);
  font-weight: 700; letter-spacing: 1px;
  padding: 12px 4px;
  cursor: pointer;
  transition: color 0.25s;
}
.tab.active { color: var(--accent); }
@media (max-width: 500px) { .app { max-width: 100%; } }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">OneApp</div>
    <div class="pill"><span class="dot"></span>Готов</div>
  </div>

  <div class="content">
    <div class="eyebrow">МЕССЕНДЖЕРЫ</div>
    <div class="grid">
      <div class="tile" onclick="openApp('https://web.whatsapp.com')">
        <div class="icon-box" style="background:rgba(37,211,102,0.12);">
          <span class="icon-text" style="color:#25D366;">WA</span>
        </div>
        <div class="name">WhatsApp</div>
        <div class="status"><span class="dot"></span>Онлайн</div>
      </div>

      <div class="tile" onclick="openApp('https://web.telegram.org/k/')">
        <div class="icon-box" style="background:rgba(41,160,217,0.12);">
          <span class="icon-text" style="color:#29A0D9;">TG</span>
        </div>
        <div class="name">Telegram</div>
        <div class="status"><span class="dot"></span>Онлайн</div>
      </div>

      <div class="tile" onclick="openApp('https://vk.com/im')">
        <div class="icon-box" style="background:rgba(74,108,247,0.12);">
          <span class="icon-text" style="color:#4A6CF7;">VK</span>
        </div>
        <div class="name">VK</div>
        <div class="status"><span class="dot"></span>Онлайн</div>
      </div>

      <div class="tile" onclick="openApp('https://web.max.ru')">
        <div class="icon-box" style="background:rgba(168,85,247,0.12);">
          <span class="icon-text" style="color:#A855F7;">MAX</span>
        </div>
        <div class="name">MAX</div>
        <div class="status"><span class="dot"></span>Онлайн</div>
      </div>
    </div>

    <div class="eyebrow">О ПРИЛОЖЕНИИ</div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;font-size:13px;color:var(--text-dim);line-height:1.5;">
      Все мессенджеры в одном месте.<br>
      Нажми на плитку — откроется приложение.
    </div>
  </div>

  <div class="tabbar">
    <div class="tab active" onclick="showHome()">HOME</div>
    <div class="tab" onclick="openApp('https://web.whatsapp.com')">WA</div>
    <div class="tab" onclick="openApp('https://web.telegram.org/k/')">TG</div>
    <div class="tab" onclick="openApp('https://vk.com/im')">VK</div>
    <div class="tab" onclick="openApp('https://web.max.ru')">MAX</div>
  </div>
</div>

<script>
function openApp(url) {
  if (window.Capacitor && window.Capacitor.isNative) {
    window.location.href = url;
  } else {
    window.open(url, '_blank');
  }
}
function showHome() {
  window.location.href = 'index.html';
}
</script>
</body>
</html>
